<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLI Parser Agent</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">C</span><h1>CLI Parser Agent</h1></div>
  <div class="top-actions">
    <button id="history-toggle" class="btn btn-ghost icon-btn mobile-only" title="打开历史记录" aria-label="打开历史记录">☰</button>
    <button id="new-run" class="btn btn-primary">新建生成</button>
  </div>
</header>
<div id="drawer-overlay" class="drawer-overlay" hidden></div>
<main class="layout">
  <aside id="sidebar" class="sidebar" aria-label="运行历史">
    <div class="sidebar-head">
      <h2>运行历史</h2>
      <div class="sidebar-actions">
        <button id="refresh" class="btn btn-ghost icon-btn" title="刷新历史记录" aria-label="刷新历史记录">↻</button>
        <button id="history-close" class="btn btn-ghost icon-btn mobile-only" title="关闭历史记录" aria-label="关闭历史记录">×</button>
      </div>
    </div>
    <p id="history-state" class="history-state">正在加载…</p>
    <ul id="history" class="history"></ul>
  </aside>
  <section class="content">
    <section id="view-new" class="view">
      <div class="page-head"><div><h2>新建生成</h2><p>创建一份共享模板与结果 Schema</p></div></div>
      <div class="form-section">
        <label class="field">
          <span class="label">标题 <em>可选</em></span>
          <input id="title" type="text" maxlength="200" placeholder="例如：show ip interface brief">
        </label>
        <div class="field">
          <div class="field-head"><span class="label">命令输出</span><span id="output-count" class="field-count">1 / 5</span></div>
          <div class="input-tabs-row">
            <div id="output-tabs" class="input-tabs" role="tablist" aria-label="命令输出"></div>
            <button id="add-output" class="btn btn-ghost btn-sm">＋ 添加输入</button>
          </div>
          <div class="input-editor-shell">
            <textarea id="output-editor" spellcheck="false" placeholder="粘贴一份完整的命令输出…"></textarea>
            <div class="input-editor-meta"><span id="output-size">0 字符 · 0 B</span><button id="remove-output" class="text-danger" hidden>删除当前输入</button></div>
          </div>
          <p id="output-error" class="error" hidden></p>
        </div>
        <fieldset class="field mode-field">
          <legend class="label">模式</legend>
          <div class="segmented">
            <label><input type="radio" name="mode" value="full" checked><span>完整生成</span></label>
            <label><input type="radio" name="mode" value="propose"><span>先提案 Schema</span></label>
          </div>
        </fieldset>
        <p id="new-error" class="error" hidden></p>
        <div class="form-actions"><button id="start" class="btn btn-primary btn-lg">开始生成</button></div>
      </div>
    </section>
    <section id="view-run" class="view" hidden>
      <div class="run-head">
        <div><h2 id="run-title">运行</h2><p id="run-sub" class="sub"></p></div>
        <div class="run-actions"><span id="run-status" class="badge"></span><button id="cancel" class="btn btn-danger btn-sm" hidden>取消</button><button id="delete" class="btn btn-ghost btn-sm" hidden>删除</button></div>
      </div>
      <details id="progress" class="panel progress-panel" hidden>
        <summary><span id="progress-phase" class="phase-pill">准备中</span><span id="progress-elapsed" class="mono"></span></summary>
        <div class="progress-body">
          <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
          <div class="progress-toolbar"><span class="label">Agent 过程</span><button id="progress-follow" class="btn btn-ghost btn-sm" type="button">跟随最新</button></div>
          <div id="agent-timeline" class="agent-timeline" aria-live="polite"></div>
        </div>
      </details>
      <section id="schema-panel" class="panel schema-panel" hidden>
        <details id="schema-collapse" open>
          <summary class="schema-summary"><span><strong>Schema 提案</strong><small>Schema 来自模型初始提案，编辑后不会改写原始生成结果。</small></span><span id="schema-state" class="save-state saved">已保存</span></summary>
          <div class="schema-panel-content">
            <div id="assumptions" class="assumptions" hidden></div>
            <div class="editor-toolbar">
              <div class="segmented compact" role="tablist" aria-label="Schema 编辑模式"><button id="schema-mode-visual" class="is-active" role="tab">可视化</button><button id="schema-mode-json" role="tab">JSON</button></div>
              <button id="add-root-field" class="btn btn-ghost btn-sm">＋ 添加根字段</button>
            </div>
            <div id="schema-visual" class="schema-visual"></div>
            <div id="schema-json" hidden><textarea id="schema-editor" class="editor" spellcheck="false"></textarea><button id="format-schema" class="btn btn-ghost btn-sm format-button">格式化 JSON</button></div>
            <div id="schema-errors" class="schema-errors" hidden></div>
            <p id="schema-message" class="message" hidden></p>
            <div class="row schema-actions"><button id="save-schema" class="btn btn-secondary">保存 Schema</button><button id="run-template" class="btn btn-primary">使用此 Schema 生成</button></div>
          </div>
        </details>
      </section>
      <section id="result-panel" class="panel result-panel" hidden>
        <div class="tabs" role="tablist"><button class="tab is-active" data-tab="template">TTP 模板</button><button class="tab" data-tab="records">Records</button><button class="tab" data-tab="schema">Schema</button><button class="tab" data-tab="inputs">原始输入</button></div>
        <div id="tab-template" class="tabpane"><button class="btn btn-ghost btn-sm copy" data-copy="template">复制</button><pre id="out-template" class="code"></pre></div>
        <div id="tab-records" class="tabpane" hidden><div id="out-records"></div></div>
        <div id="tab-schema" class="tabpane" hidden><button class="btn btn-ghost btn-sm copy" data-copy="schema">复制</button><pre id="out-schema" class="code"></pre></div>
        <div id="tab-inputs" class="tabpane" hidden><pre id="out-inputs" class="code"></pre></div>
      </section>
      <section id="issues-panel" class="panel" hidden><h3>问题</h3><ul id="issues" class="issues"></ul></section>
    </section>
  </section>
</main>
<script src="/static/agent-timeline.js?v=1"></script>
<script src="/static/schema-model.js?v=3"></script>
<script src="/static/app.js?v=3"></script>
</body>
</html>
